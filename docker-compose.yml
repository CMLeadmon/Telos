networks:
  telos-ingress:
    name: telos-ingress
    driver: bridge
    # Explicit subnet so telos-core can trust forwarding headers only from
    # this network's addresses (TELOS_TRUSTED_PROXY_CIDRS).
    ipam:
      config:
        - subnet: 10.201.0.0/24
  telos-backend:
    name: telos-backend
    driver: bridge
    internal: true
  telos-db:
    name: telos-db
    driver: bridge
    internal: true
  # The ONLY non-internal egress network besides ingress. Only the controlled
  # egress proxy joins it; ClamAV/Jellyfin/Grimmory reach the Internet solely
  # through that proxy from the internal telos-backend network.
  telos-egress:
    name: telos-egress
    driver: bridge

volumes:
  traefik_acme:
  postgres_data:
  redis_data:
  jellyfin_config:
  grimmory_config:
  grimmory_db_data:

services:
  traefik:
    image: traefik:v3.3
    container_name: telos-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - telos-ingress
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TELOS_DOMAIN=${TELOS_DOMAIN}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./config/traefik.yaml:/etc/traefik/traefik.yaml:ro,z
      - ./config/dynamic:/etc/traefik/dynamic:ro,z
      - traefik_acme:/letsencrypt

  # One-shot schema-owner migrator. Applies migrations, then exits; telos-core
  # only starts (as the least-privilege runtime role) after it succeeds.
  telos-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: telos-migrate
    command: ["./telos-core", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telos-db
    environment:
      - DATABASE_OWNER_URL=postgres://telos_owner:${TELOS_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  telos-core:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: telos-core
    restart: unless-stopped
    # Exceeds the 55s staged shutdown budget (30s HTTP + 10s sockets + 15s
    # outbox) plus cleanup margin.
    stop_grace_period: 75s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      telos-migrate:
        condition: service_completed_successfully
    networks:
      - telos-ingress
      - telos-backend
      - telos-db
    environment:
      # Least-privilege runtime role — no DDL, ownership, grants, or migration
      # writes. The one-shot telos-migrate service owns schema changes.
      - DATABASE_URL=postgres://telos_runtime:${TELOS_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JELLYFIN_ADMIN_TOKEN=${JELLYFIN_ADMIN_TOKEN}
      - JELLYFIN_USER_NAME=${JELLYFIN_USER_NAME:-}
      - JELLYFIN_LIBRARY_IDS=${JELLYFIN_LIBRARY_IDS:-}
      - GRIMMORY_LIBRARY_IDS=${GRIMMORY_LIBRARY_IDS:-}
      - GRIMMORY_ADMIN_USER=${GRIMMORY_ADMIN_USER}
      - GRIMMORY_ADMIN_PASSWORD=${GRIMMORY_ADMIN_PASSWORD}
      - TELOS_DOMAIN=${TELOS_DOMAIN}
      - TELOS_PUBLIC_ORIGIN=${TELOS_PUBLIC_ORIGIN:-https://${TELOS_DOMAIN}}
      - TELOS_TRUSTED_PROXY_CIDRS=${TELOS_TRUSTED_PROXY_CIDRS:-10.201.0.0/24}
      # Mount the mode-0600 cursor keyring at this path in production.
      - TELOS_CURSOR_KEYS_FILE=${TELOS_CURSOR_KEYS_FILE:-}
      # Dedicated mode-0600 HLS locator signing key (never a session/cursor key).
      - TELOS_HLS_SIGNING_KEY_FILE=${TELOS_HLS_SIGNING_KEY_FILE:-}
      - TELOS_STREAM_MAX_CONCURRENT=${TELOS_STREAM_MAX_CONCURRENT:-100}
      - TELOS_STREAM_MAX_PER_USER=${TELOS_STREAM_MAX_PER_USER:-6}
      - TELOS_USER_QUOTA_BYTES=${TELOS_USER_QUOTA_BYTES:-1073741824}
      - TELOS_NODE_RESERVE_BYTES=${TELOS_NODE_RESERVE_BYTES:-5368709120}
      - TELOS_ENV=${TELOS_ENV:-production}
      - TELOS_BOOTSTRAP_TOKEN=${TELOS_BOOTSTRAP_TOKEN}
    volumes:
      # One controlled shared root; the gateway confines all physical I/O
      # beneath it via openat2 (RESOLVE_BENEATH|NO_SYMLINKS|NO_MAGICLINKS).
      - ${STORAGE_PATH:-/mnt/storage/shared}:/data/shared:z
    healthcheck:
      # Readiness reflects every required dependency; a failing dep returns 503.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16.14-alpine
    container_name: telos-postgres
    restart: unless-stopped
    # Enable query statistics with parameter redaction and no statement logging.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_statement=none
    security_opt:
      - no-new-privileges:true
    networks:
      - telos-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Consumed by the clean-volume init script to create the owner/runtime
      # role split. Ignored on an existing volume (use provision-db-roles.sh).
      - TELOS_OWNER_PASSWORD=${TELOS_OWNER_PASSWORD}
      - TELOS_RUNTIME_PASSWORD=${TELOS_RUNTIME_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telos-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - telos-backend
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Controlled egress proxy: deny-by-default Squid, the single Internet path for
  # ClamAV/Jellyfin/Grimmory. Dual-homed: reachable by clients on telos-backend,
  # reaches the Internet on telos-egress.
  telos-egress-proxy:
    build:
      context: .
      dockerfile: deploy/egress-proxy/Dockerfile
    container_name: telos-egress-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - telos-backend
      - telos-egress
    volumes:
      - ./config/egress/squid.conf:/etc/squid/squid.conf:ro,z
      - ./config/egress/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro,z
    healthcheck:
      test: ["CMD-SHELL", "squid -k parse -f /etc/squid/squid.conf || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  clamav:
    image: clamav/clamav:latest
    container_name: telos-clamav
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - telos-backend
    # FreshClam reaches database.clamav.net only through the controlled proxy.
    environment:
      - http_proxy=http://telos-egress-proxy:3128
      - https_proxy=http://telos-egress-proxy:3128
      - HTTP_PROXY=http://telos-egress-proxy:3128
      - HTTPS_PROXY=http://telos-egress-proxy:3128
      - no_proxy=localhost,127.0.0.1,telos-core,postgres,redis,jellyfin,grimmory,grimmory-db
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 localhost 3310 | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: telos-jellyfin
    restart: unless-stopped
    user: "${APP_UID}:${APP_GID}"
    networks:
      - telos-backend
    environment:
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=https://${TELOS_DOMAIN}
      # Metadata/artwork fetches egress only through the controlled proxy.
      - http_proxy=http://telos-egress-proxy:3128
      - https_proxy=http://telos-egress-proxy:3128
      - HTTP_PROXY=http://telos-egress-proxy:3128
      - HTTPS_PROXY=http://telos-egress-proxy:3128
      - no_proxy=localhost,127.0.0.1,telos-core,postgres,redis,grimmory,grimmory-db
    volumes:
      - jellyfin_config:/config
      - ${STORAGE_PATH:-/mnt/storage/shared}/media:/data/media:ro,z

  grimmory-db:
    image: mariadb:10.11
    container_name: telos-grimmory-db
    restart: unless-stopped
    networks:
      - telos-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${GRIMMORY_DB_NAME}
      - MYSQL_USER=${GRIMMORY_DB_USER}
      - MYSQL_PASSWORD=${GRIMMORY_DB_PASSWORD}
    volumes:
      - grimmory_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  grimmory:
    image: grimmory/grimmory:latest
    container_name: telos-grimmory
    restart: unless-stopped
    depends_on:
      grimmory-db:
        condition: service_healthy
    networks:
      - telos-backend
      - telos-db
    environment:
      - USER_ID=${APP_UID}
      - GROUP_ID=${APP_GID}
      - TZ=${TZ}
      - DATABASE_URL=jdbc:mariadb://grimmory-db:3306/${GRIMMORY_DB_NAME}
      - DATABASE_USERNAME=${GRIMMORY_DB_USER}
      - DATABASE_PASSWORD=${GRIMMORY_DB_PASSWORD}
      - API_DOCS_ENABLED=true
      - DISK_TYPE=LOCAL
      # Metadata/cover provider fetches egress only through the controlled proxy.
      - http_proxy=http://telos-egress-proxy:3128
      - https_proxy=http://telos-egress-proxy:3128
      - HTTP_PROXY=http://telos-egress-proxy:3128
      - HTTPS_PROXY=http://telos-egress-proxy:3128
      - JAVA_TOOL_OPTIONS=-Dhttp.proxyHost=telos-egress-proxy -Dhttp.proxyPort=3128 -Dhttps.proxyHost=telos-egress-proxy -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=localhost|127.0.0.1|grimmory-db|telos-core|postgres|redis
      - no_proxy=localhost,127.0.0.1,telos-core,postgres,redis,jellyfin,grimmory-db
    volumes:
      - grimmory_config:/app/data
      - ${STORAGE_PATH:-/mnt/storage/shared}/books:/books:z
      - ${STORAGE_PATH:-/mnt/storage/shared}/bookdrop:/bookdrop:z
    healthcheck:
      # The service uses an outbound HTTP proxy; force this loopback probe to
      # stay local so it is not rejected by the egress allowlist.
      test: ["CMD-SHELL", "wget -Y off -q -O - http://localhost:6060/api/v1/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
