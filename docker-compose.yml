networks:
  telos-ingress:
    name: telos-ingress
    driver: bridge
    # Explicit subnet so telos-core can trust forwarding headers only from
    # this network's addresses (TELOS_TRUSTED_PROXY_CIDRS).
    ipam:
      config:
        - subnet: 10.201.0.0/24
  telos-backend:
    name: telos-backend
    driver: bridge
    internal: true
  telos-db:
    name: telos-db
    driver: bridge
    internal: true
  # Metrics only: joined by the gateway and Prometheus and nothing else. The gateway's
  # metrics listener answers only peers on this subnet (METRICS_ALLOW_CIDRS), and the
  # network has no host port, no route and no Internet.
  telos-observability:
    name: telos-observability
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.202.0.0/24
  # The ONLY non-internal egress network besides ingress. Only the controlled
  # egress proxy joins it; ClamAV/Jellyfin/Grimmory reach the Internet solely
  # through that proxy from the internal telos-backend network.
  telos-egress:
    name: telos-egress
    driver: bridge

# Controls every service shares. Each service still states its own user, limits,
# writable paths and (except where documented) no-new-privileges, so a reviewer
# reads one block per service; config/runtime-hardening.json is the policy these are
# verified against, statically (rendered model) and live (running containers).
x-hardened: &hardened
  cap_drop:
    - ALL
  read_only: true
  # Podman's k8s-file driver truncates a container log at max-size (it has no file
  # count); max-file is kept for provider portability.
  logging:
    driver: k8s-file
    options:
      max-size: 10m
      max-file: "3"

volumes:
  # Created owned by Traefik's non-root identity so ACME state can be written.
  traefik_acme:
    driver_opts:
      o: "uid=65532,gid=65532"
  postgres_data:
  redis_data:
  jellyfin_config:
  jellyfin_cache:
  clamav_db:
  # Grimmory is started as the node's app identity (not its root entrypoint), so
  # its data volume has to belong to that identity.
  grimmory_config:
    driver_opts:
      o: "uid=${APP_UID},gid=${APP_GID}"
  grimmory_db_data:
  prometheus_data:

services:
  traefik:
    image: docker.io/library/traefik:v3.3@sha256:2cd5cc75530c8d07ae0587c743d23eb30cae2436d07017a5ff78498b1a43d09f
    container_name: telos-traefik
    restart: unless-stopped
    stop_grace_period: 30s
    <<: *hardened
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    networks:
      - telos-ingress
    # Host-side bindings only. Traefik runs unprivileged, so it listens on 8080/8443
    # inside the container (config/traefik.yaml) while the host still serves 80/443.
    # Rootless container runtimes cannot bind privileged ports — override these
    # in .env (e.g. 8081/8443) to bring the stack up without root. Let's Encrypt
    # HTTP-01 requires the public :80, so leave the defaults in production.
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:8080"
      - "${TRAEFIK_HTTPS_PORT:-443}:8443"
    environment:
      - TELOS_DOMAIN=${TELOS_DOMAIN}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./config/traefik.yaml:/etc/traefik/traefik.yaml:ro,z
      - ./config/dynamic:/etc/traefik/dynamic:ro,z
      - traefik_acme:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # One-shot schema-owner migrator. Applies migrations, then exits; telos-core
  # only starts (as the least-privilege runtime role) after it succeeds.
  telos-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: telos-migrate
    command: ["./telos-core", "migrate"]
    restart: "no"
    <<: *hardened
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 1
    mem_limit: 256m
    pids_limit: 128
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telos-db
    environment:
      - DATABASE_OWNER_URL=postgres://telos_owner:${TELOS_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  # Restore only (profile "restore"): after a database is restored and migrated, revokes every
  # session, device, refresh token and unused invite the backup carried, in one transaction,
  # BEFORE any traffic is served. It sees only the database network and the schema-owner role.
  telos-sanitize-restore:
    profiles: ["restore"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: telos-sanitize-restore
    command: ["./telos-core", "sanitize-restore"]
    restart: "no"
    <<: *hardened
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 1
    mem_limit: 256m
    pids_limit: 128
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telos-db
    environment:
      - DATABASE_OWNER_URL=postgres://telos_owner:${TELOS_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  telos-audiobook-migrate:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: telos-audiobook-migrate
    command: ["./telos-core", "audiobook-migrate"]
    restart: "no"
    <<: *hardened
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - telos-backend
      - telos-db
    environment:
      - DATABASE_URL=postgres://telos_runtime:${TELOS_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # No STORAGE_PATH here, matching telos-core, which does the same physical
      # I/O beneath /data/shared and sets no such variable: the binary never
      # reads it, and podman-compose feeds a service's own environment block
      # back into its interpolation, so defining it silently rewrote the host
      # side of the bind mount below.
      - JELLYFIN_ADMIN_TOKEN=${JELLYFIN_ADMIN_TOKEN}
      - JELLYFIN_LIBRARY_IDS=${JELLYFIN_LIBRARY_IDS}
      # These are the names telos-core actually reads. The block previously
      # passed GRIMMORY_URL/USERNAME/PASSWORD, which nothing looks up — and a
      # port that is not Grimmory's — so the migration would have authenticated
      # with nothing the moment it grew a real implementation.
      - GRIMMORY_LIBRARY_IDS=${GRIMMORY_LIBRARY_IDS:-}
      - GRIMMORY_ADMIN_USER=${GRIMMORY_ADMIN_USER}
      - GRIMMORY_ADMIN_PASSWORD=${GRIMMORY_ADMIN_PASSWORD}
    volumes:
      # Same host default as every other service. This defaulted to
      # /data/shared, so with STORAGE_PATH unset this one service bound a
      # different host directory than the gateway it is migrating data for.
      - ${STORAGE_PATH:-/mnt/storage/shared}:/data/shared:z

  telos-core:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: telos-core
    restart: unless-stopped
    # Exceeds the 55s staged shutdown budget (30s HTTP + 10s sockets + 15s
    # outbox) plus cleanup margin.
    stop_grace_period: 75s
    <<: *hardened
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      telos-migrate:
        condition: service_completed_successfully
    # Fixed non-root identity. group_add lets the gateway write the storage tree
    # that `telos init` created for the operator's group; existing storage is
    # never recursively chowned (see documentation/operations/install.md).
    group_add:
      - "${APP_GID}"
    networks:
      - telos-ingress
      - telos-backend
      - telos-db
      - telos-observability
    environment:
      # Internal-only metrics listener (backend/metrics_server.go); it answers just the
      # observability subnet. Backup status is a textfile the backup command writes into
      # the read-only operations directory mounted below.
      - METRICS_ADDR=:9090
      - TELOS_OPS_STATE_PATH=/run/telos-ops
      # Least-privilege runtime role — no DDL, ownership, grants, or migration
      # writes. The one-shot telos-migrate service owns schema changes.
      - DATABASE_URL=postgres://telos_runtime:${TELOS_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JELLYFIN_ADMIN_TOKEN=${JELLYFIN_ADMIN_TOKEN}
      - JELLYFIN_USER_NAME=${JELLYFIN_USER_NAME:-}
      - JELLYFIN_LIBRARY_IDS=${JELLYFIN_LIBRARY_IDS:-}
      - GRIMMORY_LIBRARY_IDS=${GRIMMORY_LIBRARY_IDS:-}
      - GRIMMORY_ADMIN_USER=${GRIMMORY_ADMIN_USER}
      - GRIMMORY_ADMIN_PASSWORD=${GRIMMORY_ADMIN_PASSWORD}
      - TELOS_DOMAIN=${TELOS_DOMAIN}
      - TELOS_PUBLIC_ORIGIN=${TELOS_PUBLIC_ORIGIN:-https://${TELOS_DOMAIN}}
      - TELOS_ALLOWED_ORIGINS=${TELOS_ALLOWED_ORIGINS:-}
      - TELOS_TRUSTED_PROXY_CIDRS=${TELOS_TRUSTED_PROXY_CIDRS:-10.201.0.0/24}
      # Mount the mode-0600 cursor keyring at this path in production.
      - TELOS_CURSOR_KEYS_FILE=${TELOS_CURSOR_KEYS_FILE:-}
      # Dedicated mode-0600 HLS locator signing key (never a session/cursor key).
      - TELOS_HLS_SIGNING_KEY_FILE=${TELOS_HLS_SIGNING_KEY_FILE:-}
      - TELOS_STREAM_MAX_CONCURRENT=${TELOS_STREAM_MAX_CONCURRENT:-100}
      - TELOS_STREAM_MAX_PER_USER=${TELOS_STREAM_MAX_PER_USER:-6}
      - TELOS_USER_QUOTA_BYTES=${TELOS_USER_QUOTA_BYTES:-1073741824}
      - TELOS_NODE_RESERVE_BYTES=${TELOS_NODE_RESERVE_BYTES:-5368709120}
      - TELOS_ENV=${TELOS_ENV:-production}
      # The root filesystem is read-only: multipart upload parts spill to disk, so they go
      # to the storage volume rather than the small /tmp tmpfs.
      - TMPDIR=/data/shared/staging/tmp
      - TELOS_BOOTSTRAP_TOKEN=${TELOS_BOOTSTRAP_TOKEN}
    volumes:
      # One controlled shared root; the gateway confines all physical I/O
      # beneath it via openat2 (RESOLVE_BENEATH|NO_SYMLINKS|NO_MAGICLINKS).
      - ${STORAGE_PATH:-/mnt/storage/shared}:/data/shared:z
      # Signing roots (cursor keyring + HLS key), read-only and mounted nowhere
      # else: not Traefik, the client, databases, Jellyfin, Grimmory or ClamAV.
      - ${TELOS_CONFIG_PATH:?Run telos init first}:/run/telos:ro,z
      - ${TELOS_NODE_PATH:?Run telos init first}/ops:/run/telos-ops:ro,z
    healthcheck:
      # Readiness reflects every required dependency; a failing dep returns 503.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Static browser client: the exported Next.js app behind unprivileged nginx. It
  # joins only the ingress network, publishes nothing, mounts nothing and carries
  # no secret or runtime configuration; every API call stays same-origin through
  # Traefik to telos-core. Deliberately no depends_on: it has no API dependency.
  telos-client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telos-client
    restart: unless-stopped
    stop_grace_period: 15s
    <<: *hardened
    security_opt:
      - no-new-privileges:true
    user: "101:101"
    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=1m,mode=1777
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    networks:
      - telos-ingress
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: docker.io/library/postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: telos-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    # Starts as the image's own unprivileged user instead of root-then-gosu; the image's
    # data directory is already owned by this user, so nothing needs root.
    <<: *hardened
    # no-new-privileges is deliberately NOT set (documented exception, see
    # config/runtime-hardening.json and docs/implementation/design-alterations.md A16):
    # on Ubuntu 26.04 it leaves this image's processes under different AppArmor
    # labels and AppArmor then denies the signals its entrypoint depends on.
    # Compensating controls: non-root user, all capabilities dropped, read-only
    # root, internal-only network, default AppArmor profile still enforced.
    user: postgres
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=1m,mode=1777
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    # Enable query statistics with parameter redaction and no statement logging.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_statement=none
    networks:
      - telos-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Consumed by the clean-volume init script to create the owner/runtime
      # role split. Ignored on an existing volume (use provision-db-roles.sh).
      - TELOS_OWNER_PASSWORD=${TELOS_OWNER_PASSWORD}
      - TELOS_RUNTIME_PASSWORD=${TELOS_RUNTIME_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: telos-redis
    restart: unless-stopped
    stop_grace_period: 20s
    <<: *hardened
    security_opt:
      - no-new-privileges:true
    user: redis
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    networks:
      - telos-backend
    # maxmemory sits below mem_limit so Redis refuses to grow before the kernel would kill it;
    # only keys with a TTL (cache, rate-limit and presence entries) are evicted, never a key that
    # has none, and the capacity drill treats Redis at maxmemory as saturation.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 384mb --maxmemory-policy volatile-lru
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Controlled egress proxy: deny-by-default Squid, the single Internet path for
  # ClamAV/Jellyfin/Grimmory. Dual-homed: reachable by clients on telos-backend,
  # reaches the Internet on telos-egress.
  telos-egress-proxy:
    build:
      context: .
      dockerfile: deploy/egress-proxy/Dockerfile
    container_name: telos-egress-proxy
    restart: unless-stopped
    stop_grace_period: 15s
    <<: *hardened
    security_opt:
      - no-new-privileges:true
    user: proxy
    tmpfs:
      - /var/spool/squid:size=128m,mode=1777
      - /var/log/squid:size=64m,mode=1777
      - /run:size=1m,mode=1777
      - /tmp:size=16m,mode=1777
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    networks:
      - telos-backend
      - telos-egress
    volumes:
      - ./config/egress/squid.conf:/etc/squid/squid.conf:ro,z
      - ./config/egress/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro,z
    healthcheck:
      test: ["CMD-SHELL", "squid -k parse -f /etc/squid/squid.conf || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  clamav:
    image: docker.io/clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    container_name: telos-clamav
    restart: unless-stopped
    stop_grace_period: 30s
    <<: *hardened
    security_opt:
      - no-new-privileges:true
    user: clamav
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=4m,mode=1777,notmpcopyup
      - /var/log/clamav:size=16m,mode=1777,notmpcopyup
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    networks:
      - telos-backend
    # FreshClam reaches database.clamav.net only through the controlled proxy.
    volumes:
      - clamav_db:/var/lib/clamav
    environment:
      - http_proxy=http://telos-egress-proxy:3128
      - https_proxy=http://telos-egress-proxy:3128
      - HTTP_PROXY=http://telos-egress-proxy:3128
      - HTTPS_PROXY=http://telos-egress-proxy:3128
      - no_proxy=localhost,127.0.0.1,telos-core,postgres,redis,jellyfin,grimmory,grimmory-db
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 localhost 3310 | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  jellyfin:
    image: docker.io/jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: telos-jellyfin
    restart: unless-stopped
    stop_grace_period: 30s
    <<: *hardened
    security_opt:
      - no-new-privileges:true
    user: "${APP_UID}:${APP_GID}"
    tmpfs:
      - /tmp:size=256m,mode=1777
    cpus: 4
    mem_limit: 4g
    pids_limit: 512
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    networks:
      - telos-backend
    environment:
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=https://${TELOS_DOMAIN}
      # Metadata/artwork fetches egress only through the controlled proxy.
      - http_proxy=http://telos-egress-proxy:3128
      - https_proxy=http://telos-egress-proxy:3128
      - HTTP_PROXY=http://telos-egress-proxy:3128
      - HTTPS_PROXY=http://telos-egress-proxy:3128
      - no_proxy=localhost,127.0.0.1,telos-core,postgres,redis,grimmory,grimmory-db
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${STORAGE_PATH:-/mnt/storage/shared}/media:/data/media:ro,z
    # Liveness only: a configured Jellyfin answers the root with a redirect to its Base
    # URL, which curl -f accepts; the gateway's own readiness probe checks /jellyfin.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -m 3 http://localhost:8096/System/Info/Public"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  grimmory-db:
    image: docker.io/library/mariadb:10.11@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    container_name: telos-grimmory-db
    restart: unless-stopped
    stop_grace_period: 30s
    <<: *hardened
    # no-new-privileges is deliberately NOT set (documented exception, see
    # config/runtime-hardening.json and docs/implementation/design-alterations.md A16):
    # on Ubuntu 26.04 it leaves this image's processes under different AppArmor
    # labels and AppArmor then denies the signals its entrypoint depends on.
    # Compensating controls: non-root user, all capabilities dropped, read-only
    # root, internal-only network, default AppArmor profile still enforced.
    user: mysql
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/mysqld:size=1m,mode=1777
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    networks:
      - telos-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${GRIMMORY_DB_NAME}
      - MYSQL_USER=${GRIMMORY_DB_USER}
      - MYSQL_PASSWORD=${GRIMMORY_DB_PASSWORD}
    volumes:
      - grimmory_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  grimmory:
    image: docker.io/grimmory/grimmory:v3.5.0@sha256:bf6fe21c6e247597f7869664a440b5a34242e2d2940575cae39c17bfaa66dc0b
    container_name: telos-grimmory
    restart: unless-stopped
    stop_grace_period: 30s
    # The upstream entrypoint starts as root, creates a user in /etc/passwd and su-execs
    # to it, which needs a writable root and three capabilities. The same JVM command
    # runs directly as the node's app identity instead, with everything locked down
    # (design alteration A19); /app/data, /books and /bookdrop are mounts below.
    entrypoint: ["java", "--enable-native-access=ALL-UNNAMED", "--enable-preview", "-jar", "/app/app.jar"]
    <<: *hardened
    security_opt:
      - no-new-privileges:true
    user: "${APP_UID}:${APP_GID}"
    tmpfs:
      - /tmp:size=256m,mode=1777
    cpus: 2
    mem_limit: 2g
    pids_limit: 512
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    depends_on:
      grimmory-db:
        condition: service_healthy
    networks:
      - telos-backend
      - telos-db
    environment:
      - USER_ID=${APP_UID}
      - GROUP_ID=${APP_GID}
      - TZ=${TZ}
      - DATABASE_URL=jdbc:mariadb://grimmory-db:3306/${GRIMMORY_DB_NAME}
      - DATABASE_USERNAME=${GRIMMORY_DB_USER}
      - DATABASE_PASSWORD=${GRIMMORY_DB_PASSWORD}
      - API_DOCS_ENABLED=true
      - DISK_TYPE=LOCAL
      # Metadata/cover provider fetches egress only through the controlled proxy.
      - http_proxy=http://telos-egress-proxy:3128
      - https_proxy=http://telos-egress-proxy:3128
      - HTTP_PROXY=http://telos-egress-proxy:3128
      - HTTPS_PROXY=http://telos-egress-proxy:3128
      - JAVA_TOOL_OPTIONS=-Dhttp.proxyHost=telos-egress-proxy -Dhttp.proxyPort=3128 -Dhttps.proxyHost=telos-egress-proxy -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=localhost|127.0.0.1|grimmory-db|telos-core|postgres|redis
      - no_proxy=localhost,127.0.0.1,telos-core,postgres,redis,jellyfin,grimmory-db
    volumes:
      - grimmory_config:/app/data
      - ${STORAGE_PATH:-/mnt/storage/shared}/books:/books:z
      - ${STORAGE_PATH:-/mnt/storage/shared}/bookdrop:/bookdrop:z
    healthcheck:
      # The service uses an outbound HTTP proxy; force this loopback probe to
      # stay local so it is not rejected by the egress allowlist.
      test: ["CMD-SHELL", "wget -Y off -q -O - http://localhost:6060/api/v1/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Internal-only metrics store. No host port and no route: the operator reads it through
  # `telos status` and scripts/verify-monitoring.sh, never a public UI. Retention is
  # bounded by time and size. The lifecycle and admin APIs are off by default and
  # must stay off (their flags would turn them on).
  prometheus:
    image: docker.io/prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: telos-prometheus
    restart: unless-stopped
    stop_grace_period: 30s
    <<: *hardened
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 1
    mem_limit: 1g
    pids_limit: 128
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --web.listen-address=:9090
    networks:
      - telos-observability
    volumes:
      - ./config/prometheus:/etc/prometheus:ro,z
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
