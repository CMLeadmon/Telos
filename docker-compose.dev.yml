# Development-only host bindings. Layer this over docker-compose.yml; never
# deploy this override as part of the production stack.
services:
  telos-core:
    # Rootless development maps container root to the invoking host user, which is
    # the only identity that can read the user-owned signing files under ./.telos.
    # Production keeps the fixed 10001:10001 gateway identity from the base file.
    user: "0:0"
    environment:
      - TELOS_ENV=development
      # Finite dev-origin allowlist for the cross-origin split (frontend on
      # :3000 calls the gateway on :8080). Never set in production.
      - TELOS_PUBLIC_ORIGIN=${TELOS_PUBLIC_ORIGIN:-http://localhost:8080}
      - TELOS_DEV_ORIGINS=${TELOS_DEV_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - TELOS_TRUSTED_PROXY_CIDRS=${TELOS_TRUSTED_PROXY_CIDRS:-}
    ports:
      - "127.0.0.1:8080:8080"
