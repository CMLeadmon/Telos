name: Promote Certified Release

# Verification-only promotion of a draft prerelease that scripts/stage-release.sh created from a certified candidate.
# Nothing is built, installed, signed, renamed or uploaded here: the workflow downloads every draft asset, re-verifies
# the signed tag, the candidate graph and checksum, the evidence bundle, the certification, a distinct reviewer's signed
# approval and the exact candidate-lock digest it was given, and only then changes the draft to a published prerelease.
# release/publisher-policy.json (reviewed) names the repository and the logins allowed to publish.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Signed beta tag of the staged draft, e.g. v0.1.0-beta.1'
        required: true
      candidate_lock_digest:
        description: 'Exact candidate-lock digest, sha256:<64 hex>'
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the staged draft against the exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.candidate_lock_digest }}
        run: bash scripts/promote-release.sh --verify-only --tag "$TAG" --candidate-lock-digest "$DIGEST"

  promote:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Re-verify and publish the draft as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.candidate_lock_digest }}
        run: bash scripts/promote-release.sh --tag "$TAG" --candidate-lock-digest "$DIGEST"
