name: CI Security and Quality Gates

on:
  push:
    branches: [ main, docs-rewrite ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Run Backend Tests & Coverage
        run: |
          cd backend
          go test -race -v -coverprofile=coverage.out ./...
      - name: Vet Backend
        run: |
          cd backend
          go vet ./...

  # The harness starts disposable PostgreSQL 16.14 and Redis 7 containers on an
  # isolated network. Plain `go test` self-skips every integration test, so the
  # backend-gates job alone cannot exercise migrations, auth or realtime.
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify container runtime
        run: |
          podman --version
          podman info --format '{{.Host.OCIRuntime.Name}}'
      - name: Run backend integration suite
        run: bash scripts/test-backend.sh

  # `podman compose` needs a Compose provider and the renderer imports PyYAML.
  # Ubuntu's podman-compose is a rendering convenience for CI only; the
  # operator runtime pins its own provider (see Phase 2).
  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman Compose provider and PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose python3-yaml
      - name: Verify Compose prerequisites
        run: |
          podman --version
          podman-compose --version
          python3 -c 'import yaml'
      - name: Render and validate the production Compose model
        run: bash scripts/validate-compose.sh --env-file .env.example

  # `npm run check:a11y-evidence` is intentionally absent here. It exits 3
  # (not_run) because WCAG audit evidence must come from a candidate run that no
  # CI job can produce; a permanently red step is not a gate. The catalog keeps
  # the frontend-accessibility gate and tests/operations/ci_workflow_contract_test.py
  # pins the checker as fail-closed until a real evidence validator replaces it.
  frontend-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Lint
        run: npm --prefix frontend run lint
      - name: Type-check with the locked compiler
        run: node frontend/node_modules/typescript/bin/tsc --project frontend/tsconfig.json --noEmit
      - name: Prove the type gate catches errors
        run: bash tests/operations/frontend_types_gate_test.sh
      - name: Unit test
        run: npm --prefix frontend run test:unit
      - name: Build static export
        run: npm --prefix frontend run build
      - name: Check bundle budget
        run: npm --prefix frontend run check:bundle

  # Real Playwright execution through the managed-server wrapper. `npm run
  # check:browsers` only reads a JSON declaration, so the browser binaries are
  # installed explicitly from the locked Playwright version. The wrapper owns
  # port 3000 and its dev server; its 1650-second budget sits inside the
  # catalog's 1800-second gate.
  frontend-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium and WebKit with system libraries
        run: npm --prefix frontend exec --no -- playwright install --with-deps chromium webkit
      - name: Run Playwright through the managed dev server
        run: python3 scripts/run-playwright-gate.py --playwright-timeout-seconds 1650

  # The standalone browser client: nginx behavior against a real nginx binary and
  # the real export, then the image itself (non-root, read-only, health-checked,
  # clean filesystem) built and run with Podman.
  static-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Build the static export
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Install nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx-core
      - name: Verify the nginx routing and caching contract
        env:
          TELOS_NGINX: /usr/sbin/nginx
        run: bash tests/operations/static_client_config_test.sh
      - name: Build and inspect the static client image
        run: bash tests/operations/static_client_test.sh

  # The hosted-browser probe and outage controller against an HTTPS fixture node, plus
  # the static client's nginx contract (needs a real nginx binary).
  browser-node-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx-core
      - name: Run the browser-node fixture suite
        env:
          TELOS_NGINX: /usr/sbin/nginx
        run: bash tests/operations/browser_node_fixtures_test.sh

  # backend/out/ is gitignored, so a fresh checkout has never contained it.
  # Before the embedfrontend build tag, compiling from a clean tree failed with
  # "pattern all:out: no matching files found" -- which means backend-gates,
  # which compiles the package via go test, could not have been passing.
  check-headless-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Build and test with no frontend present
        run: |
          rm -rf frontend
          cd backend
          go test ./...
          go build -o /tmp/telos-core-headless .

  # Fails when the committed contract has fallen behind the route table. The
  # generator derives routes by walking main.go with go/ast; a hand-maintained
  # list would make this check compare itself against the JSON and always pass.
  check-api-contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Verify openapi.json is current
        run: |
          cd backend
          go run ./cmd/genopenapi --check

  # Ubuntu 24.04+ is the only server target. Preserve Linux build coverage;
  # future Windows/Mac client bundles have no server cross-compile requirement.
  check-cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Build the operator CLI for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd backend
          go build -o /dev/null ./cmd/telos

  truth-and-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install fixture prerequisites
        run: sudo apt-get install -y ripgrep python3-yaml
      - name: Verify evidence envelope contract
        run: bash tests/operations/evidence_envelope_test.sh
      - name: Verify fail-closed gate behavior
        run: bash tests/operations/beta_certification_test.sh
      - name: Verify gate catalog and runner
        run: bash tests/operations/ci_gates_test.sh
      - name: Verify accumulated suite behavior
        run: bash tests/operations/accumulated_suite_test.sh
      - name: Verify platform scope
        run: python3 tests/operations/platform_scope_test.py
      - name: Verify release graph, trust anchors, runner v2 and frozen artifacts
        run: bash tests/operations/release_test.sh
      - name: Verify product-truth mutations
        run: bash tests/operations/product_truth_test.sh
      - name: Check product truth
        run: bash scripts/check-product-truth.sh
      - name: Check release truth
        run: bash scripts/check-release-truth.sh
      - name: Verify clean-checkout inventory
        run: bash scripts/verify-clean-checkout.sh --inventory-only

  # Phase 4 operational-safety fixtures: backup and restore against fake runtimes (and a restore replayed on two
  # real PostgreSQL clusters), the upgrade/rollback state machine, hardening and monitoring policy, capacity,
  # exposure and egress judgement, and the supply-chain policy. Hermetic: nothing here touches a real node.
  operations-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep python3-yaml postgresql-16 podman
      - name: Verify the image lock and runtime hardening policy
        run: |
          bash tests/operations/image_lock_test.sh
          bash tests/operations/runtime_hardening_test.sh
      - name: Verify monitoring
        run: bash tests/operations/monitoring_test.sh
      - name: Verify backup
        run: bash tests/operations/backup_fixtures_test.sh
      - name: Verify restore
        run: bash tests/operations/restore_fixtures_test.sh
        env:
          TELOS_PG_BIN: /usr/lib/postgresql/16/bin
      - name: Verify upgrade and rollback
        run: bash tests/operations/upgrade_rollback_fixtures_test.sh
      - name: Verify capacity, exposure and egress
        run: bash tests/operations/capacity_exposure_test.sh
      - name: Verify the supply-chain policy
        run: bash tests/operations/supply_chain_test.sh

  # Source-level supply chain: the locked scanners are fetched and digest-verified, secrets are searched for in the
  # whole history, Go and production npm dependencies are checked for known vulnerabilities. Artifact SBOMs and the
  # candidate scan are release jobs: pull-request CI has no frozen artifacts.
  supply-chain-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Validate the tool lock, license policy and risk acceptances
        run: python3 scripts/lib/supply_chain.py policy
      - name: Verify release pins
        run: bash scripts/verify-release-pins.sh
      - name: Scan the history for secrets with the locked gitleaks
        run: |
          GITLEAKS="$(python3 scripts/bootstrap-ci-tools.py --tool gitleaks --cache-dir "$RUNNER_TEMP/ci-tools")"
          "$GITLEAKS" git . --no-banner --exit-code 1
      - name: Check Go dependencies for known vulnerabilities
        run: |
          cd backend
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Check production npm dependencies for known vulnerabilities
        run: |
          npm --prefix frontend ci
          npm --prefix frontend audit --omit=dev --audit-level=moderate
