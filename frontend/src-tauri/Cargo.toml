[package]
name = "telos-shell"
version = "0.1.0"
description = "Telos Native Client Shell"
authors = ["Telos Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The TLS bridge. Pinning needs the peer's actual leaf certificate, which no web
# API exposes, so the handshake happens here and reports the fingerprint back to
# the frontend. rustls gives access to the presented chain; a plain HTTP client
# would validate and then discard it, which is the whole problem.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
x509-parser = "0.16"

[lib]
name = "telos_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
