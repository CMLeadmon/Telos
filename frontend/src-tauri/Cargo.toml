[package]
name = "telos-shell"
version = "0.1.0"
description = "Telos Native Client Shell"
authors = ["Telos Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Non-secret key derivation for credential service names.
sha2 = "0.10"

# Refresh tokens live in the operating-system credential service (the Secret
# Service on Linux), never in a file. `v1` selects the zbus Secret Service store
# on Linux; the `cli` feature stays off. Exact pins: a credential dependency is
# reviewed before it moves.
keyring = { version = "=4.1.6", default-features = false, features = ["v1"] }
url = "=2.5.8"

[lib]
name = "telos_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
