# Static Telos client. Runs as UID 101 with a read-only root filesystem: every
# writable path is under /var/run or /var/cache/nginx (tmpfs in Compose).
# Security headers (CSP with the node's wss origin, HSTS, framing) are added by
# Traefik's telos-web-headers middleware, which knows the public domain; this
# container is deliberately configuration-free.
pid /var/run/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    access_log off;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_vary on;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /usr/share/nginx/html;

        # Liveness that never touches the Go gateway.
        location = /healthz {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 200 "ok\n";
        }

        # Hashed build output only: safe to cache for a year.
        location /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Exported routes: /stream/ -> /stream/index.html. HTML and RSC payloads must
        # always revalidate so a new release is picked up. A path that does not exist
        # is a real 404 -- never index.html -- so a mistyped API path cannot look valid.
        location / {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri $uri/index.html $uri.html =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
