port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
turn:
  enabled: true
  tls_port: 5349
  udp_port: 3478
  external_tls: true
redis:
  address: redis:6379
# Enforce the beta voice ceiling at the SFU as well as the gateway.
room:
  max_participants: 25
  empty_timeout: 300
  departure_timeout: 20
# Sign participant lifecycle webhooks to the gateway so seat accounting
# reconciles against authoritative SFU state. The signing key is the configured
# LIVEKIT_API_KEY; the gateway verifies against LIVEKIT_API_SECRET.
webhook:
  api_key: ${LIVEKIT_API_KEY}
  urls:
    - http://telos-core:8080/api/v1/voice/webhook
