http:
  routers:
    # Login: edge rate limit (10/min per IP, burst 5) plus the auth-body class.
    telos-login:
      rule: 'Host(`{{ env "TELOS_DOMAIN" }}`) && Path(`/api/v1/auth/login`)'
      entryPoints:
        - websecure
      priority: 260
      middlewares:
        - telos-inflight
        - telos-login-rate
        - telos-auth-body
      service: telos-core
      tls:
        certResolver: letsencrypt

    # Auth JSON: strict 16 KiB edge limit before the gateway.
    telos-auth:
      rule: 'Host(`{{ env "TELOS_DOMAIN" }}`) && PathPrefix(`/api/v1/auth`)'
      entryPoints:
        - websecure
      priority: 250
      middlewares:
        - telos-inflight
        - telos-auth-body
      service: telos-core
      tls:
        certResolver: letsencrypt

    # Streaming media and uploads: never spool a request body at the edge —
    # the gateway authorizes and admits first, then bounds the stream itself.
    telos-streaming:
      # Every line must stay at this exact indentation: YAML only folds newlines
      # into spaces for lines level with the first one, and Traefik's rule
      # parser rejects an embedded newline ("expected ')', found newline").
      rule: >-
        Host(`{{ env "TELOS_DOMAIN" }}`) &&
        (
        PathPrefix(`/api/v1/stream`) ||
        PathPrefix(`/api/v1/media`) ||
        PathPrefix(`/api/v1/files`) ||
        PathRegexp(`^/api/v1/users/[^/]+/avatar$`) ||
        Path(`/api/v1/users/me/avatar`) ||
        PathRegexp(`^/api/v1/library/books/[^/]+/(content|cover)$`)
        )
      entryPoints:
        - websecure
      priority: 200
      middlewares:
        - telos-inflight
      service: telos-core
      tls:
        certResolver: letsencrypt

    # Every other JSON API path, 64 KiB edge limit. Outranks the browser catch-all,
    # so an unknown /api/ path reaches the gateway's own 404, never the client.
    telos-api:
      rule: 'Host(`{{ env "TELOS_DOMAIN" }}`) && PathPrefix(`/api/v1`)'
      entryPoints:
        - websecure
      priority: 100
      middlewares:
        - telos-inflight
        - telos-json-body
      service: telos-core
      tls:
        certResolver: letsencrypt

    # Browser catch-all: the static client container. The only router that does
    # not target the gateway.
    telos-web:
      rule: 'Host(`{{ env "TELOS_DOMAIN" }}`) && PathPrefix(`/`)'
      entryPoints:
        - websecure
      priority: 1
      middlewares:
        - telos-inflight
        - telos-web-headers
      service: telos-client
      tls:
        certResolver: letsencrypt

  middlewares:
    # Response headers for the static client. The gateway adds these to API
    # responses itself; the client container is configuration-free, so Traefik
    # (which knows the public domain) supplies them, including the node's own
    # wss origin in connect-src for browsers that do not match 'self' to wss.
    telos-web-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), geolocation=(), payment=(), usb=(), microphone=()"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentSecurityPolicy: >-
          default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://{{ env "TELOS_DOMAIN" }}; font-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests
    # Edge in-flight ceiling matching the gateway's 128-request admission cap.
    telos-inflight:
      inFlightReq:
        amount: 128
    # Login throttle at the edge: 10 requests/minute per source IP, burst 5.
    # The gateway's atomic Redis limiter is the authoritative second layer.
    telos-login-rate:
      rateLimit:
        average: 10
        period: 1m
        burst: 5
        sourceCriterion:
          ipStrategy:
            depth: 1
    # 16 KiB auth JSON, held in memory (no disk spool).
    telos-auth-body:
      buffering:
        maxRequestBodyBytes: 16384
        memRequestBodyBytes: 16384
    # 64 KiB other JSON, held in memory.
    telos-json-body:
      buffering:
        maxRequestBodyBytes: 65536
        memRequestBodyBytes: 65536

  services:
    telos-core:
      loadBalancer:
        servers:
          - url: http://telos-core:8080
    telos-client:
      loadBalancer:
        servers:
          - url: http://telos-client:8080
