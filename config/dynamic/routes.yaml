http:
  routers:
    livekit:
      rule: 'Host(`{{ env "TELOS_DOMAIN" }}`) && PathPrefix(`/livekit`)'
      entryPoints:
        - websecure
      priority: 300
      middlewares:
        - telos-inflight
        - livekit-strip
      service: livekit
      tls:
        certResolver: letsencrypt

    # Auth JSON: strict 16 KiB edge limit before the gateway.
    telos-auth:
      rule: 'Host(`{{ env "TELOS_DOMAIN" }}`) && PathPrefix(`/api/v1/auth`)'
      entryPoints:
        - websecure
      priority: 250
      middlewares:
        - telos-inflight
        - telos-auth-body
      service: telos-core
      tls:
        certResolver: letsencrypt

    # Streaming media and uploads: never spool a request body at the edge —
    # the gateway authorizes and admits first, then bounds the stream itself.
    telos-streaming:
      rule: >-
        Host(`{{ env "TELOS_DOMAIN" }}`) && (
          PathPrefix(`/api/v1/stream`) ||
          PathPrefix(`/api/v1/media`) ||
          PathPrefix(`/api/v1/files`) ||
          PathRegexp(`^/api/v1/users/[^/]+/avatar$`) ||
          Path(`/api/v1/users/me/avatar`) ||
          PathRegexp(`^/api/v1/library/books/[^/]+/(content|cover)$`)
        )
      entryPoints:
        - websecure
      priority: 200
      middlewares:
        - telos-inflight
      service: telos-core
      tls:
        certResolver: letsencrypt

    # Default: other JSON API and the static frontend, 64 KiB edge limit.
    telos-core:
      rule: 'Host(`{{ env "TELOS_DOMAIN" }}`) && PathPrefix(`/`)'
      entryPoints:
        - websecure
      priority: 1
      middlewares:
        - telos-inflight
        - telos-json-body
      service: telos-core
      tls:
        certResolver: letsencrypt

  middlewares:
    livekit-strip:
      stripPrefix:
        prefixes:
          - /livekit
    # Edge in-flight ceiling matching the gateway's 128-request admission cap.
    telos-inflight:
      inFlightReq:
        amount: 128
    # 16 KiB auth JSON, held in memory (no disk spool).
    telos-auth-body:
      buffering:
        maxRequestBodyBytes: 16384
        memRequestBodyBytes: 16384
    # 64 KiB other JSON, held in memory.
    telos-json-body:
      buffering:
        maxRequestBodyBytes: 65536
        memRequestBodyBytes: 65536

  services:
    livekit:
      loadBalancer:
        servers:
          - url: http://livekit:7880
    telos-core:
      loadBalancer:
        servers:
          - url: http://telos-core:8080

tcp:
  routers:
    turn:
      rule: 'HostSNI(`turn.{{ env "TELOS_DOMAIN" }}`)'
      entryPoints:
        - websecure
      service: turn
      tls:
        certResolver: letsencrypt
  services:
    turn:
      loadBalancer:
        servers:
          - address: livekit:5349
