# Opt-in overlay for a node whose HTTPS certificate comes from an operator-managed
# private CA instead of public ACME (TELOS_PRIVATE_CA=1 in node.env). The CLI layers it
# automatically; never layer it by hand onto a node that expects public certificates.
services:
  traefik:
    # Traefik runs as UID 65532, so the certificate directory, server.crt and server.key
    # must be readable by that user (for example: chown root:65532 and chmod 0750/0644/0640);
    # `telos start` and `telos doctor` check it.
    volumes:
      # Same file as the base static config except the ACME directory is unreachable, so
      # nothing is ever sent to a public CA for a name it cannot validate.
      - ./config/private-ca/traefik.yaml:/etc/traefik/traefik.yaml:ro,z
      - ${TELOS_TLS_PATH:?Set TELOS_TLS_PATH to the directory holding server.crt and server.key}:/etc/telos-tls:ro,z
      - ./config/private-ca/tls.yaml:/etc/traefik/dynamic/tls.yaml:ro,z
